name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright — sciezki krytyczne
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_USER_EMAIL: e2e@example.test
      E2E_USER_PASSWORD: e2e-local-password-1234
      E2E_PORT: 3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Start Supabase
        run: npx supabase start

      # `supabase status -o env` publikuje API_URL / ANON_KEY / SERVICE_ROLE_KEY,
      # a aplikacja i seed czytaja NEXT_PUBLIC_SUPABASE_* / SUPABASE_SERVICE_ROLE_KEY.
      # Bez tego przepisania build wstalby bez adresu bazy.
      - name: Export Supabase credentials
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed test user
        run: npm run e2e:seed

      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7
