# .github/workflows/work-automation.yml
#
# Primary scheduler: Supabase Cron.
# GitHub workflow is manual fallback only.
#
# Harmonogram automatu pracy zyje w bazie: job pg_cron
# `work-automation-minute-tick` (migracja
# supabase/migrations/20260912140000_work_automation_supabase_cron.sql) wola ten
# sam endpoint CO MINUTE. GitHub Actions nie gwarantowal godziny uruchomienia
# („0 * * * *" potrafilo wystartowac kilkanascie minut pozniej), wiec swiadomie
# NIE MA tu juz klucza `schedule:` — dwa schedulery biegnace rownolegle tylko
# mnozylyby zapytania.
#
# Ten workflow zostaje wylacznie jako RECZNE narzedzie diagnostyczne dla
# administratora: „czy endpoint i sekrety w ogole odpowiadaja?". Uruchomienie
# recznie jest bezpieczne nawet w tej samej sekundzie, co tick z bazy — o braku
# duplikatow decyduja klucze w bazie (`work_automation_runs` PK na
# (user_id, local_date) i UNIQUE na work_entries (user_id, date, entry_kind)),
# nie odstep miedzy przebiegami.
#
# Sekrety repozytorium:
#   APP_URL     — adres wdrozenia, np. https://time-tracker-mateusz.vercel.app
#   CRON_SECRET — ten sam sekret, co w zmiennych srodowiskowych aplikacji

name: Work Automation (manual fallback)

on:
  # Bez `schedule:` — patrz komentarz wyzej. Harmonogram jest w Supabase Cron.
  workflow_dispatch:

jobs:
  run-work-automation:
    name: Run Work Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Invoke endpoint
        run: |
          RESPONSE=$(curl --silent --show-error --fail \
            --request POST \
            --url "${{ secrets.APP_URL }}/api/cron/work-automation" \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            --data '{}')

          echo "Response: $RESPONSE"

          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'error' in data:
              print(f'ERROR: {data[\"error\"]}')
              sys.exit(1)
          print(f'Processed: {data.get(\"processed\", 0)}, Created: {data.get(\"created\", 0)}, Skipped: {data.get(\"skipped\", 0)}, Failed: {data.get(\"failed\", 0)}')
          if data.get('failed', 0):
              print('\n'.join(data.get('errors', [])))
              sys.exit(1)
          "
